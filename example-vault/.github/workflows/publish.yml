# Lives in the content repository (the friend's vault).
# On every push that touches posts or attachments, asks the site repository to rebuild and deploy.
#
# Setup in the content repository (Settings → Secrets and variables → Actions):
#   variable SITE_REPO           owner/name of the site repository
#   secret   SITE_DISPATCH_TOKEN fine-grained token with "Contents: read and write" on the site repository
name: Publish

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "attachments/**"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Ask the site to rebuild
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            "https://api.github.com/repos/${{ vars.SITE_REPO }}/dispatches" \
            -d '{"event_type":"content-updated","client_payload":{"sha":"${{ github.sha }}"}}'
