# Site settings, edited from the admin panel (/admin/).
# Rules: schema/settings.schema.json (checked on every build). Meanings: docs/content-model.md.

site:
  # Main address of the public site, without a trailing slash.
  url: https://example.com
  title_fa: علی نادری
  title_en: Ali Naderi

# Active look of the whole site: paper or ink.
look: paper

author:
  name_fa: علی نادری
  name_en: Ali Naderi
  bio_fa: اینجا درباره‌ی فناوری، یادگیری و زندگی می‌نویسم.
  bio_en: I write about technology, learning and life.

# Top menu, in order. path is the same for both languages (/tags/ becomes /en/tags/ on English pages).
menu:
  - { label_fa: برچسب‌ها, label_en: Tags, path: /tags/ }
  - { label_fa: آرشیو, label_en: Archive, path: /archives/ }
  - { label_fa: جست‌وجو, label_en: Search, path: /search/ }
  - { label_fa: درباره‌ی من, label_en: About, path: /about/ }

social:
  - { name: telegram, url: "https://t.me/example" }
  - { name: github, url: "https://github.com/example" }
  - { name: x, url: "https://x.com/example" }
  - { name: email, url: "mailto:hello@example.com" }

telegram:
  # Public channel link shown on the site.
  channel: https://t.me/example
  # Languages whose new posts are sent to the channel.
  languages: [fa]
  # Turn post tags into #hashtags.
  hashtags: true
  footer_fa: "@example"
  footer_en: ""

seo:
  # Verification codes from Google Search Console and Bing Webmaster Tools (the content="…" value only).
  google_verification: ""
  bing_verification: ""
