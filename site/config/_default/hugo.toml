# Core Hugo configuration. Owned by the maintainer; the admin panel never edits files in config/.
# Everything the friend may change lives in data/settings.yaml.
# baseURL is replaced at build time with site.url from data/settings.yaml (see .github/workflows).

baseURL = "https://example.com/"
defaultContentLanguage = "fa"
defaultContentLanguageInSubdir = false
timeZone = "Asia/Tehran"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 40
mainSections = ["posts"]

[pagination]
  pagerSize = 10

# Addresses are permanent once posts are shared: see docs/content-model.md → "Addresses".
[permalinks.page]
  posts = "/posts/:slug/"

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["html", "rss", "json"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "series"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 80

[sitemap]
  changeFreq = "weekly"

[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    keepWhitespace = false
