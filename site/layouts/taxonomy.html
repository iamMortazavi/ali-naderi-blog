{{ define "main" }}
<div class="wrap">
  <header class="list-header">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="term-cloud">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }} <sup>{{ partial "digits.html" .Count }}</sup></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
