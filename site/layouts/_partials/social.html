{{- with hugo.Data.settings.social }}
<ul class="social">
  {{- range . }}
  <li><a href="{{ .url }}" rel="me noopener" aria-label="{{ .name }}" title="{{ .name }}">{{ partial "icon.html" .name }}</a></li>
  {{- end }}
  {{- with site.Home.OutputFormats.Get "rss" }}
  <li><a href="{{ .RelPermalink }}" aria-label="RSS" title="RSS">{{ partial "icon.html" "rss" }}</a></li>
  {{- end }}
</ul>
{{- end }}
