{{ define "main" }}
<div class="wrap">
  <header class="list-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{- with site.Home.OutputFormats.Get "json" }}
  <form class="search-form" role="search" action="" onsubmit="return false">
    <label class="visually-hidden" for="q">{{ T "searchPlaceholder" }}</label>
    <span class="search-icon">{{ partial "icon.html" "search" }}</span>
    <input id="q" name="q" type="search" autocomplete="off" placeholder="{{ T "searchPlaceholder" }}"
      data-index="{{ .RelPermalink }}" data-empty="{{ T "searchEmpty" }}" data-loading="{{ T "searchLoading" }}">
  </form>
  {{- end }}
  <div id="search-results" class="post-list" aria-live="polite"></div>
</div>
{{ end }}
