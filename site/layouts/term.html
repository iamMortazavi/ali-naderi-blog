{{ define "main" }}
<div class="wrap">
  <header class="list-header">
    <nav class="breadcrumbs"><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></nav>
    <h1>#{{ .Title }}</h1>
    <p class="list-count">{{ partial "digits.html" (T "postsCount" (len .Pages)) }}</p>
  </header>
  {{- $pager := .Paginate .Pages }}
  <div class="post-list">
    {{- range $pager.Pages }}
    {{ partial "post-card.html" . }}
    {{- end }}
  </div>
  {{ partial "pagination.html" . }}
</div>
{{ end }}
