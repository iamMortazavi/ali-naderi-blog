<!doctype html>
<html lang="{{ site.Language.Lang }}" dir="{{ site.Language.Direction | default "ltr" }}" data-look="{{ hugo.Data.settings.look | default "paper" }}" data-theme="light">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#main">{{ T "skip" }}</a>
{{ partial "header.html" . }}
<main id="main" class="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
</body>
</html>
