name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, analyse, test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Same list blog:install checks on the server, plus SQLite for the tests.
          extensions: intl, gd, pdo_mysql, pdo_sqlite, sqlite3, mbstring, fileinfo, zip, openssl, ctype, dom, tokenizer, xmlreader, iconv, session, filter, curl
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        # Tests use SQLite in memory (phpunit.xml); no MySQL service is needed.
        run: |
          cp .env.example .env
          php artisan key:generate --force --ansi

      - name: Code style (Pint)
        run: composer lint:check

      - name: Static analysis (Larastan)
        # Not blocking yet: existing findings are being worked through.
        continue-on-error: true
        run: composer analyse -- --no-progress --error-format=github

      - name: Tests
        run: php artisan test
