# Checks every pull request against the example vault. Deploys nothing.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
      - name: Build example site
        uses: ./.github/actions/build-site
        with:
          vault: example-vault
          environment: staging
      - name: Telegram dry run
        run: python -m blogtools.telegram --base-url https://example.com --dry-run --state build/empty-state.json
