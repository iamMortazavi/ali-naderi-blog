# Staging: the same site on GitHub Pages, for checking changes before (and without) the cPanel host.
# Hidden from search engines (noindex + robots.txt Disallow). Never posts to Telegram.
# Uses the friend's vault when CONTENT_REPO and CONTENT_TOKEN are set, otherwise example-vault/.

name: Staging (GitHub Pages)

# Started by hand only: a private repository on a free plan cannot use the github-pages environment,
# and a push trigger would fail on every commit. Once the repository is public (or on GitHub Pro),
# add the same push and repository_dispatch triggers as deploy.yml.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true   # Pages publishes all at once, so a newer run can safely replace an older one

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out content (the friend's vault)
        if: vars.CONTENT_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}
          path: _vault

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        uses: ./.github/actions/build-site
        with:
          vault: ${{ vars.CONTENT_REPO != '' && '_vault' || 'example-vault' }}
          base-url: ${{ steps.pages.outputs.base_url }}
          environment: staging

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
