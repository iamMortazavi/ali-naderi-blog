# Shared build used by deploy.yml (production, cPanel) and pages.yml (staging, GitHub Pages).
# Checks settings and notes, converts the vault, builds with Hugo into site/public.
name: Build site
description: Convert the vault and build the Hugo site

inputs:
  vault:
    description: Path to the content repository (Obsidian vault)
    required: true
  base-url:
    description: Public address the site is built for; empty means site.url from data/settings.yaml
    default: ""
  environment:
    description: Hugo environment (production or staging; staging pages are hidden from search engines)
    default: production

outputs:
  base-url:
    description: The address the site was built for, without a trailing slash
    value: ${{ steps.url.outputs.base-url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tools/requirements.txt

    - name: Install tools
      shell: bash
      run: |
        pip install -r tools/requirements.txt
        HUGO_VERSION=$(cat .hugo-version)
        curl -fsSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        tar -xzf /tmp/hugo.tar.gz -C /tmp hugo && sudo mv /tmp/hugo /usr/local/bin/
        hugo version

    - name: Unit tests
      shell: bash
      env: { PYTHONPATH: tools }
      run: python -m unittest discover -s tools/tests -t tools

    - id: url
      name: Check settings
      shell: bash
      env: { PYTHONPATH: tools }
      run: |
        python -m blogtools.settings --check
        url="${{ inputs.base-url }}"
        [ -n "$url" ] || url=$(python -m blogtools.settings --get site.url)
        echo "base-url=${url%/}" >> "$GITHUB_OUTPUT"

    - id: content
      name: Convert and check notes
      shell: bash
      env: { PYTHONPATH: tools }
      run: python -m blogtools.build_content --vault "${{ inputs.vault }}"

    - uses: actions/cache@v4
      with:
        path: site/resources/_gen
        key: hugo-images-${{ hashFiles('site/content/**/*.png', 'site/content/**/*.jpg', 'site/content/**/*.jpeg', 'site/content/**/*.webp', 'site/assets/images/**') }}
        restore-keys: hugo-images-

    - name: Build with Hugo
      shell: bash
      run: |
        hugo --source site --gc --minify --environment "${{ inputs.environment }}" --baseURL "${{ steps.url.outputs.base-url }}/"
        # Point the admin panel at this repository and site.
        sed -i -e "s#^  repo: .*#  repo: ${GITHUB_REPOSITORY}#" \
               -e "s#^site_url: .*#site_url: ${{ steps.url.outputs.base-url }}#" site/public/admin/config.yml
        content_sha=$(git -C "${{ inputs.vault }}" rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")
        printf '{"commit":"%s","content":"%s","built_at":"%s"}\n' \
          "$GITHUB_SHA" "$content_sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/public/build.json
